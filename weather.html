<!DOCTYPE html>
<html>
<head>

    <title>Weather Heatmap</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <style>

        html, body {
            margin: 0;
            height: 100%;
        }

        #map {
            height: 100%;
        }

        #controls {

            position: absolute;
            top: 10px;
            left: 50px;

            z-index: 1000;

            background: white;

            padding: 10px;

            border-radius: 5px;

            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

    </style>

</head>
<body>




    
<div id="controls">
<div>
    Variable:
    <select id="variableSelect">
        <option value="temperature">Temperature</option>
        <option value="windSpeed">Wind Speed</option>
    </select>
</div>
    <div>
        Forecast Hour:
        <span id="hourLabel">0</span>
    </div>

    <input
        type="range"
        id="hourSlider"
        min="0"
        max="23"
        value="0"
    >

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const variableConfig = {

    temperature: {

        label: "Temperature",

        units: "°F",

        min: -20,

        max: 110
    },

    windSpeed: {

        label: "Wind Speed",

        units: " mph",

        min: 0,

        max: 60
    }
};
    
const map = L.map('map').setView(
    [40.0, -105.3],
    8
);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);

const variableSelect =
    document.getElementById("variableSelect");

    
variableSelect.addEventListener(
    "change",
    () => {
        updateMap(
            parseInt(slider.value)
        );
    }
);
    
let boundaryData;
let weatherData;

const gridLayers = {};

const slider =
    document.getElementById("hourSlider");

const hourLabel =
    document.getElementById("hourLabel");

initialize();

async function initialize() {

    boundaryData =
        await fetch("data/boundaries.json")
        .then(r => r.json());

    weatherData =
        await fetch("data/weather.json")
        .then(r => r.json());

    createPolygons();

    updateMap(0);

    slider.addEventListener(
        "input",
        () => {

            const hour =
                parseInt(slider.value);

            hourLabel.textContent =
                weatherData.gridpoints[
                    Object.keys(
                        weatherData.gridpoints
                    )[0]
                ][hour].time;

            updateMap(hour);
        }
    );
}

function createPolygons() {

    for (
        const gridId
        in boundaryData.boundaries
    ) {

        const polygon =
            boundaryData.boundaries[
                gridId
            ];

        const coords =
            polygon.coordinates[0]
            .map(coord => [
                coord[1],
                coord[0]
            ]);

        const layer =
            L.polygon(coords, {

                fillOpacity: 0.8,

                weight: 0

            });

        layer.addTo(map);

        gridLayers[gridId] =
            layer;
    }
}

function updateMap(hourIndex) {

    
    
    const selectedVariable =
        variableSelect.value;

    const config =
        variableConfig[
            selectedVariable
        ];

    for (
        const gridId
        in weatherData.gridpoints
    ) {

        const data =
            weatherData.gridpoints[
                gridId
            ][hourIndex];

        
        let value = data[selectedVariable];

if (selectedVariable === "windSpeed") {

    value =
        parseFloat(value);
}

        const layer =
            gridLayers[gridId];

        let fillColor;

if (selectedVariable === "windSpeed") {

    fillColor =
        getWindColor(value);

} else {

    fillColor =
        getColor(
            value,
            config.min,
            config.max
        );
}

layer.setStyle({

    fillColor: fillColor

});

        layer.bindPopup(`
            <b>${gridId}</b><br>
            Temperature: ${data.temperature} °F<br>
            Wind: ${data.windSpeed} mph<br>
            Time: ${data.time}
        `);
    }
}

function getWindColor(speed) {



    const ratio =
        (speed) /
        (40);

    const hue =
        120 - ratio * 120;

    return `hsl(${hue},100%,50%)`;
}
    

function getColor(
    temp,
    minTemp,
    maxTemp
) {

    const ratio =
        (temp - minTemp) /
        (maxTemp - minTemp);

    const hue =
        120 - ratio * 120;

    return `hsl(${hue},100%,50%)`;
}

setInterval(
    refreshWeather,
    3600000
);

async function refreshWeather() {

    weatherData =
        await fetch(
            `data/weather.json?t=${Date.now()}`
        )
        .then(r => r.json());

    updateMap(
        parseInt(
            slider.value
        )
    );
}

</script>

</body>
</html>
